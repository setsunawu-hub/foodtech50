<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食品技師衝刺闖關</title>
<style>
:root{
  --bg:#f6f4ee;--card:#fffefa;--ink:#24302a;--mute:#6b766f;--line:#e4e0d3;
  --brand:#2f7d5b;--brand-ink:#fff;--accent:#e0a526;--danger:#c0504a;--lock:#a9aea9;
  --soft:#e8f3ec;--shadow:0 1px 3px rgba(40,50,40,.08),0 6px 20px rgba(40,50,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191a;--card:#1d2322;--ink:#e6ece8;--mute:#93a099;--line:#2c3532;
    --brand:#4fb589;--brand-ink:#0d1a14;--accent:#e3b341;--danger:#e07a73;--lock:#58625d;
    --soft:#203229;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15191a;--card:#1d2322;--ink:#e6ece8;--mute:#93a099;--line:#2c3532;
  --brand:#4fb589;--brand-ink:#0d1a14;--accent:#e3b341;--danger:#e07a73;--lock:#58625d;
  --soft:#203229;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em}
.spacer{flex:1}
.pts{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--soft);padding:4px 12px;border-radius:99px}
.pts small{color:var(--mute);font-weight:400}
.lvl{max-width:860px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:200px;border:0;background:none;padding:10px 4px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
h1,h2,h3{line-height:1.3;margin:0}
h2{font-size:20px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:600}
.tag.warn{background:#fbefd0;color:#8a6208}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.warn{background:#3a3014;color:#e3b341}}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:10px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.sm{padding:3px 10px;font-size:13px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:24px;height:24px;margin-top:2px;accent-color:var(--brand);flex:none}
.task label{flex:1;cursor:pointer}
.task .p{flex:none;font-weight:700;color:var(--accent)}
.task.done label{color:var(--mute);text-decoration:line-through}
.task.disabled{opacity:.5}
.kw{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.kw code{background:var(--soft);padding:1px 8px;border-radius:6px;font-size:14px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(10,1fr)}}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative}
.cell b{font-size:15px}
.cell.done{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cell.cur{outline:3px solid var(--accent)}
.cell.part{background:var(--soft)}
.cell.lock{color:var(--lock)}
.cell.star::after{content:"★";position:absolute;top:1px;right:4px;font-size:11px;color:var(--accent)}
.cell.done.star::after{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute);margin-top:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.vault{display:grid;gap:12px}
.item .head{display:flex;align-items:center;gap:10px;cursor:pointer}
.item .head h3{font-size:17px;flex:1}
.item.lock .head h3{color:var(--mute)}
.item .body{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.item .body h4{margin:14px 0 4px;font-size:15px}
.item .body ul{margin:4px 0;padding-left:20px}
.item .body li{margin:3px 0}
.item .body table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.item .body th,.item .body td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.item .body th{background:var(--soft)}
.formula{background:var(--soft);border-radius:8px;padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:14px;margin:6px 0;overflow-x:auto;white-space:pre-wrap}
.item .need{font-size:13px;color:var(--mute)}
dialog{border:0;border-radius:16px;padding:24px;max-width:min(92vw,420px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
input[type=text],input[type=date]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login h1{font-size:28px}
.profiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%}
.toast{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .3s}
@keyframes pop{from{transform:translateY(-10px) scale(.9);opacity:0}}
.cert{text-align:center;border:3px double var(--accent);border-radius:12px;padding:24px 12px}
.cert h3{font-size:24px;margin-bottom:8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============ 計畫資料（來源：食品技師 50 天複習計畫；題庫：考古雲） ============ */
const SUBJ = {chem:"食品化學",micro:"食品微生物學",proc:"食品加工學",anal:"食品分析與檢驗",law:"食品衛生安全與法規",fact:"食品工廠管理"};
/* P1 每列：[科目代號, 主題, 搜尋關鍵字, 近年題例]
   題例代號：114 為專技高考卷，115 為高等考試卷；化=食品化學、微=食品微生物學、加=食品加工學、分=食品分析與檢驗、法=食品衛生安全與法規、工=食品工廠管理 */
const P1 = [
 ["chem","水分與水活性、吸附等溫線、玻璃轉移","水活性、等溫吸濕","115 加 4-3 脫水遲滯"],
 ["chem","澱粉糊化、老化與凝膠、改質澱粉、膠體與硫酸化多醣、膳食纖維","澱粉、凝膠、硫酸化多醣","114 化 2-1；115 化 2"],
 ["chem","脂質：油脂氧化、抗氧化劑、氫化與轉酯化、反式脂肪；乳化與卵磷脂","油脂、氧化、乳化","114 化 4-1；115 分 4-1"],
 ["chem","蛋白質功能性（變性、凝膠、乳化、起泡）與乳蛋白（酪蛋白膠粒、凝乳酶）","蛋白質、泡沫、酪蛋白、凝乳酶","114 化 2-2、4-2、5；115 加 2"],
 ["chem","梅納與酵素性褐變、色素（葉綠素、類胡蘿蔔素、花青素）與安定化、風味、維生素","梅納、葉綠素、色素","114 化 1、3；115 化 4"],
 ["chem","小考日：默寫架構圖，重做錯題，再挑 1 題應用題（潔淨標章、植物肉）用化學原理作答","錯題複習","115 化 1、3"],
 ["micro","微生物生長與環境因子（aw、pH、溫度、柵欄技術）、嗜冷菌","生長、柵欄、嗜冷","114 微 1；115 微 5-1"],
 ["micro","食品腐敗、指標菌與衛生指標（腸桿菌科）、生物膜、交叉污染","腐敗、指標菌、生物膜","114 微 3；115 微 4、5"],
 ["micro","病原菌 I：病原性大腸桿菌 5 類、沙門氏菌、李斯特菌、曲狀桿菌、腸炎弧菌","大腸桿菌、腸炎弧菌","114 微 1、2；115 法 4"],
 ["micro","病原菌 II：金黃色葡萄球菌、仙人掌桿菌、肉毒桿菌、產氣莢膜梭菌，毒素、病毒與寄生蟲、肉品常見致病菌","肉毒、毒素、肉製品","114 微 4；114 法 2"],
 ["micro","殺菌動力學（D、z、F 值）、調氣包裝 MAP 與微生物控制","D值、F值、調氣包裝","115 微 1；115 加 4-4、4-5"],
 ["micro","乳酸菌與發酵（有機酸、細菌素）、檢驗方法（菌落計數、MPN、免疫分析、PCR），小考","乳酸菌、細菌素、免疫分析","115 微 2、3"],
 ["proc","加工保存原理、熱處理與罐頭殺菌、F 值、Food danger zone","罐頭、殺菌、F值","115 加 4-1、4-5"],
 ["proc","冷藏、冷凍（IQF）、乾燥（脫水遲滯）與濃縮（蒸發、膜、冷凍）","冷凍、乾燥、濃縮","114 加 3；115 加 4-2、4-3"],
 ["proc","乳品加工與蛋品加工（蛋白起泡）","乳品、蛋、起泡","115 加 2；114 化 5"],
 ["proc","肉品加工（注射、乾醃、浸漬醃製）與水產加工","醃製、肉製品、水產","115 加 1"],
 ["proc","油脂製備與精製（脫膠、脫酸、脫色）、穀類烘焙、果蔬與飲料加工","油脂精製、烘焙、果汁","115 加 3"],
 ["proc","發酵食品（普洱茶）、新興技術（PEF、高壓、3D 列印、擠壓）與包裝，小考","PEF、3D列印、發酵","114 加 1、2、4"],
 ["anal","方法確效（專一性、準確度、精密度、LOD／LOQ）、樣品前處理、統計","確效、精密度、前處理","114 分 1、5"],
 ["anal","一般成分分析：水分（真空烘箱、蒸餾、計算題）、灰分、粗蛋白、粗脂肪、纖維","水分、真空乾燥、凱氏","114 分 2；115 分 1"],
 ["anal","傳統化學定量法：還原糖（Somogyi、Bertrand）、蛋白呈色（Lowry、Millon）、碘價、TBA、揮發酸、Conway 微量擴散","還原糖、Lowry、碘價","114 分 4；115 分 2、4、5"],
 ["anal","儀器分析：GC（裝置、ECD、FPD）、HPLC 正相與逆相、超臨界萃取、質譜、PCR 與 ELISA；感官品評略讀，小考","氣相層析、超臨界、HPLC","114 分 3、4-1；115 分 3"],
 ["law","食品安全衛生管理法：總則、標示、廣告、輸入、罰則；基因改造食品定義與安全評估","食品安全衛生管理法、基因改造","115 法 1"],
 ["law","食品添加物、營養標示、過敏原、健康食品規定；食品詐欺","添加物、過敏原、食品詐欺","114 法 3"],
 ["law","GHP 準則（含 114 年從業人員修正）、HACCP、ISO 22000、追溯追蹤與業者登錄","HACCP、GHP、追溯","114 法 5；114 工 3；115 工 3"],
 ["law","食安科學題：食物中毒病因（魚貝毒、細菌）、阪崎腸桿菌、食因性寄生蟲、丙烯醯胺、殘留限量與案例，小考","食物中毒、寄生蟲、丙烯醯胺","114 法 1、2、4；115 法 2、3、5"],
 ["fact","工廠設計與佈置、衛生設施、廢棄物與廢水處理","工廠、佈置、廢棄物","115 工 3"],
 ["fact","品質管理：5M1E 根因分析、統計製程管制、抽樣、供應商評鑑與原料管控","5M1E、管制圖、供應商","114 工 2；115 工 1、5"],
 ["fact","生產管理：產能（設計、有效、利用率）、存貨與訂貨生產、成本（固定、變動、半固定）、設備與 CIP","產能、訂貨生產、成本","114 工 1、4；115 工 2"],
 ["fact","食品安全管理：過敏原管理、外送與餐飲 GHP；第一階段總驗收：六科錯題彙整","過敏原、外送、錯題複習","114 工 3；115 工 4"],
];
const QUIZ = [6,12,18,22,26,30];
const P2 = [
 ["chem","第一輪","114 年食品化學（專技高考卷）","批改，補寫弱題架構"],
 ["micro","第一輪","114 年食品微生物學（專技高考卷）","批改，重算殺菌值題"],
 ["proc","第一輪","114 年食品加工學（專技高考卷）","批改，補流程圖與參數"],
 ["anal","第一輪","114 年食品分析與檢驗（專技高考卷）","批改，補儀器原理與計算"],
 ["law","第一輪","114 年食品衛生安全與法規（專技高考卷）","批改，核對最新條文"],
 ["fact","第一輪","114 年食品工廠管理（專技高考卷）","批改，並寫第一輪總檢討"],
 ["chem","第二輪","115 年食品化學","批改，並做 113 年食品化學申論題 2 題"],
 ["micro","第二輪","115 年食品微生物學","批改，並做 113 年食品微生物學申論題 2 題"],
 ["proc","第二輪","115 年食品加工學","批改，並做 113 年食品加工學申論題 2 題"],
 ["anal","第二輪","115 年食品分析與檢驗","批改，並做 113 年食品分析與檢驗申論題 2 題"],
 ["law","第二輪","115 年食品衛生安全與法規","批改，並做 113 年同科申論題 2 題"],
 ["fact","第二輪","115 年食品工廠管理","批改，並比較兩輪分數，排出弱點順位"],
];
const P3 = [
 ["食品化學、食品微生物學弱點","只讀錯題本中這兩科的題目，每題重寫一次答案"],
 ["食品加工學、食品分析與檢驗弱點","只讀錯題本中這兩科的題目，每題重寫一次答案，加上儀器與流程圖默寫"],
 ["食品衛生安全與法規、食品工廠管理弱點","核對法規最新修正，重寫條文與數字題"],
 ["公式與數據卡、六科架構圖","默寫 D 值、z 值、F 值、水活性、凱氏定氮、檢量線、管制圖公式，再對照公式卡"],
 ["全真模擬日 1","用模擬考或歷屆卷連考 3 科，嚴守時間（科目順序以考選部簡章為準）"],
 ["全真模擬日 2","連考另外 3 科，晚上整理兩天的失分原因"],
 ["錯題總清","把錯題複習中仍答錯的題目全部重寫，只做一輪"],
 ["考前休整","只瀏覽六科架構圖與公式卡，準備證件與文具，早睡"],
];
const SEARCH_URL = "https://examscloud.net/search?track=food-technologist";
const LINKS = {
  exam114:"https://examscloud.net/prep/food-technologist/114",
  exam115:"https://examscloud.net/prep/food-technologist/115",
  exam113:"https://examscloud.net/prep/food-technologist/113",
  mock:"https://examscloud.net/mock-exam",
  wrong:"https://examscloud.net/wrong-questions",
  stats:"https://examscloud.net/stats",
  all:"https://examscloud.net/prep/food-technologist",
};

/* ============ 歷屆卷連結（考古雲線上瀏覽頁） ============ */
const EXAM_BASE = "https://examscloud.net/exam/";
const EXAM_PRE = "%E9%A3%9F%E5%93%81%E6%8A%80%E5%B8%AB-";
const SLUG = {
  chem:"%E9%A3%9F%E5%93%81%E5%8C%96%E5%AD%B8",
  micro:"%E9%A3%9F%E5%93%81%E5%BE%AE%E7%94%9F%E7%89%A9%E5%AD%B8",
  proc:"%E9%A3%9F%E5%93%81%E5%8A%A0%E5%B7%A5%E5%AD%B8",
  anal:"%E9%A3%9F%E5%93%81%E5%88%86%E6%9E%90%E8%88%87%E6%AA%A2%E9%A9%97",
  law:"%E9%A3%9F%E5%93%81%E8%A1%9B%E7%94%9F%E5%AE%89%E5%85%A8%E8%88%87%E6%B3%95%E8%A6%8F",
  fact:"%E9%A3%9F%E5%93%81%E5%B7%A5%E5%BB%A0%E7%AE%A1%E7%90%86"
};
/* 專技高考卷網址結尾為 -2；高等考試卷沒有後綴（115 年只有高等考試卷） */
function paperUrl(yr,sk,pro){ return EXAM_BASE+yr+"-"+EXAM_PRE+SLUG[sk]+(pro?"-2":""); }
function paperLinks(sk){
  return [["115 高考",115,false],["114 專技高考",114,true],["114 高考",114,false],["113 專技高考",113,true],["113 高考",113,false]]
    .map(a=>`<a href="${paperUrl(a[1],sk,a[2])}" target="_blank" rel="noopener">${a[0]}</a>`).join(" · ");
}

/* ============ 衝刺版：10/30–11/14，共 16 天，11/15 起考兩天 ============ */
const EXAM_DATE="2026-11-15", START="2026-10-30";
const ORDER=["chem","micro","proc","anal","law","fact"];
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d;}
const WD="日一二三四五六";
function fmt(d){return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）";}
function buildDays(){
  const days=[];
  ORDER.forEach((sk,i)=>{

function dayDone(u,day){ const dn=u.done[day.d]||[]; return day.tasks.every(t=>dn.includes(t.id)); }
function dayPartial(u,day){ return (u.done[day.d]||[]).length>0; }
function dayUnlocked(u,d){ return d===1 || dayDone(u,DAYS[d-2]); }
function currentDay(u){ const x=DAYS.find(dy=>!dayDone(u,dy)); return x?x.d:DAYS.length; }
function allDone(u){ return DAYS.every(dy=>dayDone(u,dy)); }

function streakInfo(dates){
  const s=[...new Set(dates)].sort(); const out={}; let run=0, prev=null;
  s.forEach(ds=>{
    const dt=new Date(ds+"T00:00:00");
    if(prev && Math.round((dt-prev)/864e5)===1) run++; else run=1;
    out[ds]=run; prev=dt;
  });
  return out;
}
function currentStreak(u){
  const m=streakInfo(u.logins), t=todayStr();
  const y=new Date(Date.now()-864e5).toLocaleDateString("sv");
  return m[t]||m[y]||0;
}
function calc(u){
  let task=0,bonus=0,login=0,streak=0;
  DAYS.forEach(day=>{
    const dn=u.done[day.d]||[];
    day.tasks.forEach(t=>{ if(dn.includes(t.id)) task+=t.pts; });
    if(dayDone(u,day)) bonus+=day.bonus;
  });
  const m=streakInfo(u.logins);
  Object.values(m).forEach(n=>{ login+=LOGIN_PTS; streak+=5*Math.min(n-1,6); });
  return {task,bonus,login,streak,total:task+bonus+login+streak};
}
function levelOf(total){
  let i=0; LEVELS.forEach((l,k)=>{ if(total>=l[0]) i=k; });
  const next=LEVELS[i+1];
  return {name:LEVELS[i][1],i,next, pct: next?(total-LEVELS[i][0])/(next[0]-LEVELS[i][0])*100:100};
}

    <div style="font-size:48px">🍱</div>
    <h1>食品技師衝刺闖關</h1>
    <p class="mute">10/30–11/4 逐科高頻考點 → 11/5–11/10 整卷練習 → 11/11–11/14 錯題總清與休整，11/15 上場。<br>每天登入、完成任務就有點數，點數越多，越重要的公式卡與作戰手冊就越早解鎖。</p>
    ${names.length?`<p class="mute">選擇帳號</p><div class="profiles">${names.map(n=>`<button class="btn pri" data-pick="${esc(n)}">${esc(n)}</button>`).join("")}</div><p class="mute">或建立新帳號</p>`:""}
    <form id="lf" style="display:flex;gap:8px;margin-top:8px">
      <input type="text" id="nm" maxlength="20" placeholder="輸入你的暱稱" autocomplete="nickname" required>
      <button class="btn pri" style="white-space:nowrap">開始</button>
    </form>
    <p class="mute" style="margin-top:16px">進度存在這個瀏覽器裡（沒有伺服器帳號）；換裝置前請到「我的」匯出備份。</p>
   </div></div>`;
  document.getElementById("lf").onsubmit=e=>{
    e.preventDefault();
    const n=document.getElementById("nm").value.trim().slice(0,20);
    if(!n) return;
    if(!store.users[n]) store.users[n]={created:todayStr(),done:{},logins:[],startDate:"",seen:[]};
    login(n);
  };
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>login(b.dataset.pick));
}
function login(n){
  store.current=n; const u=U();
  const t=todayStr();
  if(!u.seen) u.seen=[];
  if(!u.logins.includes(t)){
    u.logins.push(t);
    const s=streakInfo(u.logins)[t];
    const bonus=5*Math.min(s-1,6);
    save(); render();
    toast(`每日登入 +${LOGIN_PTS}`+(bonus?`，連續 ${s} 天 +${bonus}`:""));
    return;
  }
  save(); render();
}

/* ============ 主畫面 ============ */
function render(){
  if(!store.current||!U()) return renderLogin();
  const u=U(), c=calc(u), lv=levelOf(c.total);
  if(ui.sel===null) ui.sel=currentDay(u);
  const app=document.getElementById("app");
  app.innerHTML=`
   <header class="top">
    <div class="top-in"><span class="brand">🍱 食品技師衝刺</span><span class="spacer"></span>
      <span class="pts">⭐ ${c.total} <small>點</small></span></div>
    <div class="lvl"><span>${esc(lv.name)}</span><div class="bar"><i style="width:${lv.pct}%"></i></div>
      <span>${lv.next?`差 ${lv.next[0]-c.total} 點升「${lv.next[1]}」`:"已達最高等級"}</span></div>
   </header>
   <main class="wrap" id="main"></main>
   <nav class="tabs">
     ${[["today","📝","今日"],["map","🗺️","地圖"],["vault","🔓","寶庫"],["me","👤","我的"]].map(t=>`<button data-tab="${t[0]}" class="${ui.tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}</button>`).join("")}
   </nav>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab; render(); scrollTo(0,0);});
  const main=document.getElementById("main");
  ({today:viewToday,map:viewMap,vault:viewVault,me:viewMe})[ui.tab](main,u,c);
}

function viewToday(el,u,c){
  const day=DAYS[ui.sel-1], unlocked=dayUnlocked(u,day.d), dn=u.done[day.d]||[];
  const earned=day.tasks.filter(t=>dn.includes(t.id)).reduce((a,t)=>a+t.pts,0)+(dayDone(u,day)?day.bonus:0);
  const max=day.tasks.reduce((a,t)=>a+t.pts,0)+day.bonus;
  const streak=currentStreak(u);
  const left=Math.round((new Date(EXAM_DATE+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/864e5);
  const countdown=`<span class="tag warn">${left>0?"距離考試還有 "+left+" 天":left===0?"今天考試，加油":"考試已開始"}</span> `;
  el.innerHTML=`
   <div class="card" style="margin-top:16px">
     <div class="daynav">
       <button class="btn sm" id="prev" ${day.d===1?"disabled":""}>‹ 前一天</button>
       <div style="text-align:center"><b style="font-size:20px">Day ${day.d}・${day.date}</b><div class="mute">${esc(PHASE_NAME[day.phase])}</div></div>
       <button class="btn sm" id="next" ${day.d===DAYS.length?"disabled":""}>後一天 ›</button>
     </div>
   </div>
   <div class="card">
     ${countdown}<span class="tag">${esc(day.subj)}</span> ${day.quiz?'<span class="tag warn">小考日</span>':""}
     <h2 style="margin:8px 0 4px">${esc(day.title)}</h2>
     ${day.kw?`<div class="kw mute">搜尋關鍵字：${day.kw.split("、").map(k=>`<code>${esc(k)}</code>`).join("")} <a href="${SEARCH_URL}" target="_blank" rel="noopener">找考題 ↗</a></div>`:""}
     ${day.ex?`<div class="mute" style="margin-top:6px">近年題例：${esc(day.ex)}</div>`:""}
     ${day.sk&&day.phase<=2?`<div class="kw mute" style="margin-top:6px">歷屆卷：${paperLinks(day.sk)}</div>`:""}
     ${day.phase===2?`<div class="kw mute"><a href="${LINKS.exam114}" target="_blank" rel="noopener">114 年總覽</a> · <a href="${LINKS.exam115}" target="_blank" rel="noopener">115 年總覽</a> · <a href="${LINKS.exam113}" target="_blank" rel="noopener">113 年總覽</a></div>`:""}
     ${day.phase===3?`<div class="kw mute"><a href="${LINKS.exam115}" target="_blank" rel="noopener">115 年總覽</a> · <a href="${LINKS.mock}" target="_blank" rel="noopener">模擬考</a> · <a href="${LINKS.wrong}" target="_blank" rel="noopener">錯題複習</a></div>`:""}
   </div>
   <div class="card">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
       <b>今日任務</b><span class="mute">${earned} / ${max} 點</span></div>
     ${!unlocked?`<p class="mute">🔒 先完成 Day ${day.d-1} 才能開始這一天。</p>`:""}
     ${day.tasks.map(t=>`
       <div class="task ${dn.includes(t.id)?"done":""} ${unlocked?"":"disabled"}">
         <input type="checkbox" id="t${t.id}" data-t="${t.id}" ${dn.includes(t.id)?"checked":""} ${unlocked?"":"disabled"}>
         <label for="t${t.id}">${esc(t.text)}</label><span class="p">+${t.pts}</span>
       </div>`).join("")}
     <div class="task" style="opacity:${dayDone(u,day)?1:.6}"><span style="width:24px;text-align:center">🎁</span><span style="flex:1">全部完成的當日獎勵</span><span class="p">+${day.bonus}</span></div>
   </div>
   <div class="card mute">🔥 連續登入 ${streak} 天 ・ 每日登入 +${LOGIN_PTS}，連續天數再加 5 點（最多 +30）</div>`;
  document.getElementById("prev").onclick=()=>{ui.sel--;render();};
  document.getElementById("next").onclick=()=>{ui.sel++;render();};
  el.querySelectorAll("[data-t]").forEach(cb=>cb.onchange=()=>toggleTask(day,cb.dataset.t,cb.checked));
}

function toggleTask(day,tid,on){
  const u=U(), before=calc(u), prevLv=levelOf(before.total).i;
  const prevVault=VAULT.filter(v=>before.total>=v.pts).length, wasDone=dayDone(u,day);
  const list=u.done[day.d]||(u.done[day.d]=[]);
  const i=list.indexOf(tid);
  if(on&&i<0) list.push(tid); else if(!on&&i>=0) list.splice(i,1);
  save();
  const after=calc(u), delta=after.total-before.total;
  render();
  if(delta>0) toast(`+${delta} 點`+(!wasDone&&dayDone(u,day)?`（含當日獎勵 ${day.bonus}）`:""));
  else if(delta<0) toast(`${delta} 點（取消勾選）`);
  const lv=levelOf(after.total);
  if(lv.i>prevLv) setTimeout(()=>toast(`🎉 升級：${lv.name}`),700);
  const nv=VAULT.filter(v=>after.total>=v.pts);
  if(nv.length>prevVault) setTimeout(()=>toast(`🔓 解鎖：${nv[nv.length-1].title}`),1300);
  if(!wasDone&&dayDone(u,day)&&day.d<DAYS.length&&ui.sel===day.d){
    setTimeout(()=>{ if(confirm(`Day ${day.d} 完成！要前往 Day ${day.d+1} 嗎？`)){ui.sel=day.d+1;render();scrollTo(0,0);} },1500);
  }
  if(allDone(u)&&!u.certShown){ u.certShown=true; save(); setTimeout(()=>{ui.tab="vault";render();toast("🏆 全部完成！結業證書已解鎖");},1800); }
}

function viewMap(el,u){
  const cur=currentDay(u);
  el.innerHTML=`<h2>16 天地圖</h2>
   ${[1,2,3].map(ph=>`
     <div class="card"><b>${PHASE_NAME[ph]}</b> <span class="mute">D${DAYS.find(d=>d.phase===ph).d}–D${[...DAYS].reverse().find(d=>d.phase===ph).d}</span>
      <div class="grid" style="margin-top:10px">
      ${DAYS.filter(d=>d.phase===ph).map(d=>{
        const cls=dayDone(u,d)?"done":dayPartial(u,d)?"part":"", lock=!dayUnlocked(u,d.d)?"lock":"";
        return `<button class="cell ${cls} ${lock} ${d.quiz||d.d===DAYS.length?"star":""} ${d.d===cur?"cur":""}" data-d="${d.d}"><small>D</small><b>${d.d}</b></button>`;
      }).join("")}</div></div>`).join("")}
   <div class="legend"><span><i class="sw" style="background:var(--brand)"></i>已完成</span><span><i class="sw" style="background:var(--soft)"></i>進行中</span><span><i class="sw" style="outline:2px solid var(--accent)"></i>目前關卡</span><span>★ 小考／模擬／最後一天</span></div>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.d;
    if(!dayUnlocked(u,d)) return toast(`🔒 先完成 Day ${d-1}`);
    ui.sel=d; ui.tab="today"; render(); scrollTo(0,0);
  });
}

function viewVault(el,u,c){
  const items=VAULT.map(v=>({...v,ok:c.total>=v.pts}));
  const certOk=allDone(u);
  el.innerHTML=`<h2>寶庫</h2><p class="mute">累積點數達標就會解鎖（解鎖不扣點）。越重要、越難背的內容，門檻越高。</p>
   <div class="vault">
   ${items.map(v=>`
    <div class="card item ${v.ok?"":"lock"}">
      <div class="head" data-o="${v.id}"><span style="font-size:24px">${v.ok?v.icon:"🔒"}</span>
        <h3>${esc(v.title)}</h3>
        ${v.ok?`<span class="tag">${ui.open[v.id]?"收合":"展開"}</span>`:`<span class="need">${c.total} / ${v.pts}</span>`}</div>
      ${v.ok?(ui.open[v.id]?`<div class="body">${v.body}</div>`:""):`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,c.total/v.pts*100)}%"></i></div><div class="need" style="margin-top:4px">還差 ${v.pts-c.total} 點解鎖</div>`}
    </div>`).join("")}
    <div class="card item ${certOk?"":"lock"}">
      <div class="head" data-o="cert"><span style="font-size:24px">${certOk?"🏆":"🔒"}</span><h3>${CERT.title}</h3>
        ${certOk?`<span class="tag">${ui.open.cert?"收合":"展開"}</span>`:`<span class="need">${CERT.need}</span>`}</div>
      ${certOk&&ui.open.cert?`<div class="body"><div class="cert"><div style="font-size:48px">🏆</div><h3>${esc(store.current)}</h3>
        <p>完成「食品技師 16 天衝刺計畫」全部關卡<br>累積 ${c.total} 點 ・ ${esc(levelOf(c.total).name)}</p><p class="mute">祝你金榜題名</p></div></div>`:""}
    </div></div>`;
  el.querySelectorAll("[data-o]").forEach(h=>h.onclick=()=>{
    const id=h.dataset.o, v=items.find(x=>x.id===id);
    if(id==="cert"?!certOk:!v.ok) return toast("🔒 尚未解鎖");
    ui.open[id]=!ui.open[id]; render();
  });
}

function viewMe(el,u,c){
  const doneDays=DAYS.filter(d=>dayDone(u,d)).length;
  el.innerHTML=`<h2>${esc(store.current)} 的進度</h2>
   <div class="stat card">
     <div><b>${c.total}</b>總點數</div><div><b>${doneDays}/${DAYS.length}</b>完成天數</div>
     <div><b>${currentStreak(u)}</b>連續登入</div><div><b>${esc(levelOf(c.total).name)}</b>等級</div></div>
   <div class="card"><b>點數來源</b>
     <table style="width:100%;margin-top:8px;border-collapse:collapse">
      ${[["任務",c.task],["當日完成獎勵",c.bonus],["每日登入",c.login],["連續登入加成",c.streak]].map(r=>`<tr><td style="padding:4px 0">${r[0]}</td><td style="text-align:right"><b>${r[1]}</b></td></tr>`).join("")}</table></div>
   <div class="card"><b>備份與帳號</b>
     <p class="mute">資料只存在這個瀏覽器。換裝置或清除資料前請先匯出。</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exp">匯出進度</button><button class="btn" id="imp">匯入進度</button>
      <button class="btn" id="out">登出／換帳號</button><button class="btn" id="rst" style="color:var(--danger)">重設此帳號</button></div>
     <input type="file" id="file" accept="application/json" class="hidden"></div>
   <div class="card mute">參考連結：<a href="${LINKS.all}" target="_blank" rel="noopener">考古題總覽</a> ・ <a href="${LINKS.wrong}" target="_blank" rel="noopener">錯題複習</a> ・ <a href="${LINKS.stats}" target="_blank" rel="noopener">學習紀錄</a> ・ <a href="https://examscloud.net/forum" target="_blank" rel="noopener">討論區</a></div>`;
  document.getElementById("out").onclick=()=>{store.current=null;save();render();};
  document.getElementById("rst").onclick=()=>{
    if(!confirm(`確定重設「${store.current}」的所有進度？此動作無法復原。`)) return;
    store.users[store.current]={created:todayStr(),done:{},logins:[todayStr()],startDate:"",seen:[]};
    ui.sel=null; save(); render();
  };
  document.getElementById("exp").onclick=()=>{
    const blob=new Blob([JSON.stringify({name:store.current,user:u},null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`foodtech50-${store.current}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  const file=document.getElementById("file");
  document.getElementById("imp").onclick=()=>file.click();
  file.onchange=async()=>{
    try{
      const j=JSON.parse(await file.files[0].text());
      if(!j.name||!j.user||typeof j.user.done!=="object"||!Array.isArray(j.user.logins)) throw 0;
      const name=String(j.name).slice(0,20);
      if(store.users[name]&&!confirm(`已有帳號「${name}」，要覆蓋嗎？`)) return;
      store.users[name]={created:String(j.user.created||todayStr()),done:j.user.done,logins:j.user.logins.map(String),startDate:String(j.user.startDate||""),seen:[]};
      store.current=name; ui.sel=null; save(); render(); toast("匯入完成");
    }catch(e){ toast("檔案格式不正確"); }
  };
}

if(store.current&&store.users[store.current]) login(store.current); else render();
</script>
</body>
</html>
